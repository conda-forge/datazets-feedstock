schema_version: 1

context:
  version: "1.1.6"

package:
  name: datazets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datazets/datazets-${{ version }}.tar.gz
  sha256: ea095fd96e42bb85d0094d5c56aa46fb45c99db49c57482c1d170af113268a45

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python =${{ python_min }}
    - setuptools
  run:
    - numpy
    - pandas
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - datazets
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - pip check

about:
  summary: Datazets is a python package to import well known example data sets.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/erdogant/datazets

extra:
  recipe-maintainers:
    - danielnachun
